<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Finder Screenshots</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .screenshot { margin: 20px 0; border: 1px solid #ddd; background: white; }
        .download-btn { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 10px; }
        canvas { display: block; margin: 10px auto; }
    </style>
</head>
<body>
    <h1>Job Finder Application Screenshots</h1>
    
    <div class="screenshot">
        <h3>Homepage Interface</h3>
        <canvas id="homepage" width="1200" height="800"></canvas>
        <button class="download-btn" onclick="downloadImage('homepage', 'homepage-interface.png')">Download</button>
    </div>

    <div class="screenshot">
        <h3>Job Search Results</h3>
        <canvas id="jobsearch" width="1200" height="800"></canvas>
        <button class="download-btn" onclick="downloadImage('jobsearch', 'job-search-results.png')">Download</button>
    </div>

    <div class="screenshot">
        <h3>Skill Assessment Test</h3>
        <canvas id="skilltest" width="1200" height="800"></canvas>
        <button class="download-btn" onclick="downloadImage('skilltest', 'skill-assessment-test.png')">Download</button>
    </div>

    <div class="screenshot">
        <h3>Resume Builder</h3>
        <canvas id="resume" width="1200" height="800"></canvas>
        <button class="download-btn" onclick="downloadImage('resume', 'resume-builder.png')">Download</button>
    </div>

    <div class="screenshot">
        <h3>Career Test System</h3>
        <canvas id="career" width="1200" height="800"></canvas>
        <button class="download-btn" onclick="downloadImage('career', 'career-test-system.png')">Download</button>
    </div>

    <div class="screenshot">
        <h3>Mobile Responsive View</h3>
        <canvas id="mobile" width="400" height="800"></canvas>
        <button class="download-btn" onclick="downloadImage('mobile', 'mobile-responsive.png')">Download</button>
    </div>

    <script>
        function createHomepage() {
            const canvas = document.getElementById('homepage');
            const ctx = canvas.getContext('2d');
            
            // Background
            const gradient = ctx.createLinearGradient(0, 0, 1200, 800);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1200, 800);
            
            // Header
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 1200, 80);
            
            // Logo
            ctx.fillStyle = '#3498db';
            ctx.fillRect(20, 15, 120, 50);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('JobFinder', 30, 45);
            
            // Navigation
            ctx.fillStyle = 'white';
            ctx.font = '14px Arial';
            const navItems = ['Jobs', 'Companies', 'Services', 'Resume', 'Skills'];
            navItems.forEach((item, i) => {
                ctx.fillText(item, 180 + (i * 80), 45);
            });
            
            // Search Section
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(50, 120, 1100, 100);
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Find Your Dream Job', 80, 160);
            ctx.font = '16px Arial';
            ctx.fillText('Search by keyword, location, or company', 80, 190);
            
            // Search boxes
            ctx.strokeStyle = '#ddd';
            ctx.strokeRect(80, 200, 300, 40);
            ctx.strokeRect(400, 200, 200, 40);
            ctx.fillStyle = '#007bff';
            ctx.fillRect(620, 200, 100, 40);
            ctx.fillStyle = 'white';
            ctx.font = '14px Arial';
            ctx.fillText('Search', 650, 225);
            
            // Job Cards
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = 'white';
                ctx.fillRect(80 + (i * 350), 280, 320, 180);
                ctx.strokeStyle = '#e9ecef';
                ctx.strokeRect(80 + (i * 350), 280, 320, 180);
                
                ctx.fillStyle = '#2c3e50';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(`Software Developer ${i + 1}`, 100 + (i * 350), 310);
                ctx.font = '14px Arial';
                ctx.fillText('Tech Company Inc.', 100 + (i * 350), 330);
                ctx.fillText('₹8-12 LPA', 100 + (i * 350), 350);
                ctx.fillText('React, JavaScript, Node.js', 100 + (i * 350), 370);
                
                // Apply button
                ctx.fillStyle = '#28a745';
                ctx.fillRect(100 + (i * 350), 400, 80, 30);
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.fillText('Quick Apply', 110 + (i * 350), 420);
            }
        }

        function createJobSearch() {
            const canvas = document.getElementById('jobsearch');
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 1200, 800);
            
            // Header
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 1200, 80);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('JobFinder', 30, 45);
            
            // Search Results Header
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Search Results for "React Developer"', 50, 130);
            ctx.font = '16px Arial';
            ctx.fillText('Found 25 jobs matching your criteria', 50, 160);
            
            // Job Results
            const jobs = [
                { title: 'Senior React Developer', company: 'TechCorp Solutions', salary: '₹12-18 LPA', location: 'Bangalore' },
                { title: 'Frontend React Engineer', company: 'StartupXYZ', salary: '₹8-14 LPA', location: 'Mumbai' },
                { title: 'Full Stack Developer (React)', company: 'InnovateTech', salary: '₹10-16 LPA', location: 'Delhi' },
                { title: 'React.js Developer', company: 'WebSolutions Inc', salary: '₹6-12 LPA', location: 'Pune' }
            ];
            
            jobs.forEach((job, i) => {
                const y = 200 + (i * 120);
                ctx.fillStyle = 'white';
                ctx.fillRect(50, y, 1100, 100);
                ctx.strokeStyle = '#e9ecef';
                ctx.strokeRect(50, y, 1100, 100);
                
                ctx.fillStyle = '#2c3e50';
                ctx.font = 'bold 18px Arial';
                ctx.fillText(job.title, 80, y + 30);
                ctx.font = '14px Arial';
                ctx.fillText(job.company, 80, y + 50);
                ctx.fillText(job.salary, 80, y + 70);
                ctx.fillText(job.location, 300, y + 50);
                
                // Apply button
                ctx.fillStyle = '#007bff';
                ctx.fillRect(1000, y + 20, 100, 35);
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.fillText('Apply Now', 1020, y + 42);
            });
        }

        function createSkillTest() {
            const canvas = document.getElementById('skilltest');
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 1200, 800);
            
            // Header
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 1200, 80);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('JobFinder - Skill Assessment', 30, 45);
            
            // Test Interface
            ctx.fillStyle = 'white';
            ctx.fillRect(100, 120, 1000, 600);
            ctx.strokeStyle = '#e9ecef';
            ctx.strokeRect(100, 120, 1000, 600);
            
            // Progress bar
            ctx.fillStyle = '#e9ecef';
            ctx.fillRect(150, 160, 900, 20);
            ctx.fillStyle = '#28a745';
            ctx.fillRect(150, 160, 450, 20);
            
            ctx.fillStyle = '#2c3e50';
            ctx.font = '14px Arial';
            ctx.fillText('Question 5 of 10 - 50% Complete', 150, 200);
            
            // Question
            ctx.font = 'bold 20px Arial';
            ctx.fillText('JavaScript Skill Assessment', 150, 240);
            ctx.font = '16px Arial';
            ctx.fillText('What is the output of the following code?', 150, 280);
            
            // Code block
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(150, 300, 900, 120);
            ctx.strokeStyle = '#ddd';
            ctx.strokeRect(150, 300, 900, 120);
            ctx.fillStyle = '#2c3e50';
            ctx.font = '14px monospace';
            ctx.fillText('const arr = [1, 2, 3];', 170, 330);
            ctx.fillText('console.log(arr.map(x => x * 2));', 170, 350);
            
            // Options
            const options = ['A) [1, 2, 3]', 'B) [2, 4, 6]', 'C) [1, 4, 9]', 'D) undefined'];
            options.forEach((option, i) => {
                const y = 460 + (i * 40);
                ctx.fillStyle = 'white';
                ctx.fillRect(150, y, 900, 35);
                ctx.strokeStyle = '#ddd';
                ctx.strokeRect(150, y, 900, 35);
                ctx.fillStyle = '#2c3e50';
                ctx.font = '14px Arial';
                ctx.fillText(option, 170, y + 22);
            });
            
            // Next button
            ctx.fillStyle = '#007bff';
            ctx.fillRect(950, 650, 100, 40);
            ctx.fillStyle = 'white';
            ctx.font = '14px Arial';
            ctx.fillText('Next', 980, 675);
        }

        function createResume() {
            const canvas = document.getElementById('resume');
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 1200, 800);
            
            // Header
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 1200, 80);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('JobFinder - Resume Builder', 30, 45);
            
            // Form Section
            ctx.fillStyle = 'white';
            ctx.fillRect(50, 120, 550, 600);
            ctx.strokeStyle = '#e9ecef';
            ctx.strokeRect(50, 120, 550, 600);
            
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Build Your Resume', 80, 160);
            
            // Form fields
            const fields = ['Full Name', 'Email', 'Phone', 'Skills', 'Experience'];
            fields.forEach((field, i) => {
                const y = 200 + (i * 80);
                ctx.font = '14px Arial';
                ctx.fillText(field, 80, y);
                ctx.strokeStyle = '#ddd';
                ctx.strokeRect(80, y + 10, 480, 35);
            });
            
            // Preview Section
            ctx.fillStyle = 'white';
            ctx.fillRect(650, 120, 500, 600);
            ctx.strokeStyle = '#e9ecef';
            ctx.strokeRect(650, 120, 500, 600);
            
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Live Preview', 680, 160);
            
            // Resume preview
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(680, 180, 440, 500);
            ctx.strokeStyle = '#ddd';
            ctx.strokeRect(680, 180, 440, 500);
            
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('JOHN DOE', 700, 220);
            ctx.font = '12px Arial';
            ctx.fillText('Software Developer', 700, 240);
            ctx.fillText('john.doe@email.com | +91-9876543210', 700, 260);
            
            ctx.font = 'bold 14px Arial';
            ctx.fillText('SKILLS', 700, 300);
            ctx.font = '12px Arial';
            ctx.fillText('• React.js, JavaScript, HTML, CSS', 700, 320);
            ctx.fillText('• Node.js, Express, MongoDB', 700, 340);
            
            // Download button
            ctx.fillStyle = '#28a745';
            ctx.fillRect(680, 690, 120, 40);
            ctx.fillStyle = 'white';
            ctx.font = '14px Arial';
            ctx.fillText('Download PDF', 700, 715);
        }

        function createCareer() {
            const canvas = document.getElementById('career');
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 1200, 800);
            
            // Header
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 1200, 80);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('JobFinder - Career Guidance', 30, 45);
            
            // Career Test Results
            ctx.fillStyle = 'white';
            ctx.fillRect(100, 120, 1000, 600);
            ctx.strokeStyle = '#e9ecef';
            ctx.strokeRect(100, 120, 1000, 600);
            
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Your Career Path Results', 150, 170);
            
            // Recommended Career
            ctx.fillStyle = '#e8f5e8';
            ctx.fillRect(150, 200, 900, 150);
            ctx.strokeStyle = '#28a745';
            ctx.strokeRect(150, 200, 900, 150);
            
            ctx.fillStyle = '#28a745';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('🎯 Recommended: Software Developer', 180, 240);
            ctx.fillStyle = '#2c3e50';
            ctx.font = '14px Arial';
            ctx.fillText('Based on your interests in technology and problem-solving', 180, 270);
            ctx.fillText('Average Salary: ₹6-15 LPA | Growth Rate: 22% annually', 180, 290);
            ctx.fillText('Required Skills: Programming, Logic, Communication', 180, 310);
            
            // Other Suggestions
            const careers = [
                { title: 'Data Analyst', match: '85%', salary: '₹4-10 LPA' },
                { title: 'UI/UX Designer', match: '78%', salary: '₹5-12 LPA' },
                { title: 'Product Manager', match: '72%', salary: '₹8-20 LPA' }
            ];
            
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('Other Career Matches', 150, 400);
            
            careers.forEach((career, i) => {
                const y = 430 + (i * 60);
                ctx.fillStyle = 'white';
                ctx.fillRect(150, y, 900, 50);
                ctx.strokeStyle = '#e9ecef';
                ctx.strokeRect(150, y, 900, 50);
                
                ctx.fillStyle = '#2c3e50';
                ctx.font = '16px Arial';
                ctx.fillText(career.title, 180, y + 20);
                ctx.fillText(`Match: ${career.match}`, 180, y + 40);
                ctx.fillText(career.salary, 400, y + 30);
            });
        }

        function createMobile() {
            const canvas = document.getElementById('mobile');
            const ctx = canvas.getContext('2d');
            
            // Phone frame
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 400, 800);
            
            // Screen
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(20, 40, 360, 720);
            
            // Header
            ctx.fillStyle = '#667eea';
            ctx.fillRect(20, 40, 360, 60);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('JobFinder', 40, 75);
            
            // Menu button
            ctx.fillStyle = 'white';
            ctx.fillRect(320, 55, 30, 20);
            
            // Search section
            ctx.fillStyle = 'white';
            ctx.fillRect(40, 120, 320, 80);
            ctx.strokeStyle = '#ddd';
            ctx.strokeRect(40, 120, 320, 80);
            ctx.fillStyle = '#2c3e50';
            ctx.font = '14px Arial';
            ctx.fillText('Search Jobs', 60, 145);
            ctx.strokeRect(60, 155, 280, 30);
            
            // Job cards (mobile)
            for (let i = 0; i < 4; i++) {
                const y = 220 + (i * 120);
                ctx.fillStyle = 'white';
                ctx.fillRect(40, y, 320, 100);
                ctx.strokeStyle = '#e9ecef';
                ctx.strokeRect(40, y, 320, 100);
                
                ctx.fillStyle = '#2c3e50';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(`Job Title ${i + 1}`, 60, y + 25);
                ctx.font = '12px Arial';
                ctx.fillText('Company Name', 60, y + 45);
                ctx.fillText('₹8-12 LPA', 60, y + 65);
                
                // Apply button
                ctx.fillStyle = '#007bff';
                ctx.fillRect(280, y + 20, 60, 25);
                ctx.fillStyle = 'white';
                ctx.font = '10px Arial';
                ctx.fillText('Apply', 300, y + 37);
            }
        }

        function downloadImage(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }

        // Generate all screenshots
        window.onload = function() {
            createHomepage();
            createJobSearch();
            createSkillTest();
            createResume();
            createCareer();
            createMobile();
        };
    </script>
</body>
</html>
